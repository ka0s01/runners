<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Chennai Runners BBU 2026</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--card2:#f8f9fc;--line:#e4e8f0;--txt:#111827;--mut:#6b7280;
  --acc:#2563eb;--acc2:#7c3aed;--hi:#f59e0b;--ok:#16a34a;--bad:#dc2626;--shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.05);
  --heat-s:62%;--heat-l:50%;--heat-a:.28;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b0e14;--card:#141923;--card2:#0f131b;--line:#232a38;--txt:#eef1f7;--mut:#8a93a6;
  --acc:#5b9dff;--acc2:#a78bfa;--hi:#fbbf24;--ok:#34d399;--bad:#f87171;--shadow:none;--heat-a:.4;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:1200px;margin:0 auto;padding:0 16px}

/* hero */
.hero{padding:22px 0 14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{margin:2px 0 0;font-size:clamp(22px,5vw,32px);line-height:1.1;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mut);white-space:nowrap;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.dot.err{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* leaderboard */
.lb{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lb h2{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
.lbrow{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:0}
.rk{font-weight:800;color:var(--mut);text-align:center}
.lbrow:nth-child(2) .rk{color:#d4a017}.lbrow:nth-child(3) .rk{color:#9ca3af}.lbrow:nth-child(4) .rk{color:#b87333}
.lbn{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbn small{color:var(--mut);font-weight:700;margin-right:6px}
.lbl{font-weight:800;font-size:17px;text-align:right}.lbl small{font-size:11px;color:var(--mut);font-weight:600;margin-left:3px}
.lbt{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;text-align:right;min-width:62px}

/* controls */
.controls{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.tab{border:0;background:none;color:var(--mut);font:600 14px inherit;padding:10px;border-radius:9px;cursor:pointer;transition:.15s}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 2px 8px rgba(91,80,230,.35)}
.filters{display:flex;gap:8px;margin-top:8px}
input,select{font:inherit;font-size:14px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;box-shadow:var(--shadow)}
input{flex:1;min-width:0}
input:focus,select:focus{border-color:var(--acc)}

/* table */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
.wrap{overflow:auto;max-height:calc(100vh - 230px);min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;white-space:nowrap;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td:not(.t){background:var(--card2)}
thead th{position:sticky;top:0;z-index:2;background:var(--card2);font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-top:10px;padding-bottom:10px}
thead th small{display:block;font-weight:500;text-transform:none;letter-spacing:0;opacity:.8}
.sticky{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;min-width:150px;max-width:190px;border-right:1px solid var(--line)}
tbody tr:hover .sticky{background:var(--card2)}
thead .sticky{z-index:3;background:var(--card2)}
.runner{display:flex;align-items:center;gap:10px}
.bibtag{flex:none;min-width:34px;text-align:center;font-size:12px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);padding:3px 7px;border-radius:7px}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.loops{font-weight:800;font-size:18px;color:var(--txt)}
.loops.zero{color:var(--line)}
.sub{color:var(--mut);font-size:13px}
.t{font-weight:600;font-size:13.5px}
.t i{display:inline-block;padding:4px 9px;border-radius:8px;font-style:normal}
.t.best i{outline:2px solid var(--hi);outline-offset:-2px;font-weight:800}
.empty{color:var(--line)}
.dns{color:var(--mut);font-style:italic;text-align:left}
.dns i{font-style:normal;font-weight:700;font-size:12px;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);padding:4px 10px;border-radius:8px}
.legend{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--mut);padding:14px 0 28px}
.bar{width:90px;height:8px;border-radius:99px;background:linear-gradient(90deg,hsl(140,62%,50%),hsl(70,62%,50%),hsl(0,62%,52%))}
.msg{padding:40px 20px;text-align:center;color:var(--mut)}
.pill{display:inline-block;width:10px;height:10px;border-radius:3px;outline:2px solid var(--hi);outline-offset:-2px;margin-left:10px}
@media (max-width:520px){
  .app{padding:0 10px}
  th,td{padding:10px 9px}
  .sticky{min-width:128px;max-width:140px}
  .live span.t-label{display:none}
}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="eyebrow">Live loop tracker</div>
        <h1>Chennai Runners BBU 2026</h1>
      </div>
      <div class="live"><span class="dot" id="dot"></span><span id="upd">loading…</span></div>
    </div>
    <div class="lb"><h2>Leaderboard · Top 5</h2><div id="lb"><div class="msg" style="padding:16px">No loops logged yet</div></div></div>
  </section>

  <div class="controls">
    <div class="seg">
      <button class="tab on" data-tab="all">Everyone</button>
      <button class="tab" data-tab="fav">Watchlist</button>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search name or bib…" autocomplete="off">
      <select id="sort"><option value="bib">Bib</option><option value="loops">Most loops</option><option value="name">Name</option></select>
    </div>
  </div>

  <div class="card"><div class="wrap" id="wrap"><div class="msg">Loading…</div></div></div>
  <div class="legend">Faster <span class="bar"></span> Slower <span class="pill"></span> Personal best</div>
</div>

<script>
const WATCH = [10,12,16,40,55,54,25,53,51,20];
const REFRESH_MS = 15000;
let tab = "all", data = null;

function parseCSV(s){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){ if(ch=='"'){ if(s[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==',') {r.push(c);c=""}
    else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!='\r') c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
// returns minutes (number) or null
function parseTime(v){
  v=(v||"").trim().toLowerCase();
  if(!v||v.startsWith("e.g")) return null;
  let m=v.match(/^(\d+):(\d+):(\d+)$/); if(m) return +m[1]*60+ +m[2]+ +m[3]/60;
  m=v.match(/^(\d+):(\d+)$/); if(m) return +m[1]+ +m[2]/60;
  m=v.match(/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\s*(?:(\d+)\s*(?:m|min|mins)?)?$/); if(m) return +m[1]*60+(+m[2]||0);
  m=v.match(/(\d+(?:\.\d+)?)\s*(?:m|min|mins|minutes)?\s*(?:(\d+)\s*s)?/); if(m) return +m[1]+(+m[2]||0)/60;
  return null;
}
function fmt(min){
  const tot=Math.round(min*60), h=Math.floor(tot/3600), m=Math.floor(tot%3600/60), s=tot%60;
  if(h) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return s? `${m}:${String(s).padStart(2,"0")}` : `${m} min`;
}
function build(csv){
  const rows=parseCSV(csv);
  const hours=rows[0].slice(3), labels=rows[1].slice(3);
  const runners=[];
  for(const r of rows.slice(2)){
    const bib=parseInt(r[0]); if(!bib) continue;
    const loops=[]; const DNS=/^(dns|d\.?n\.?s\.?|did\s*not\s*start|not\s*start(ed)?|no\s*show|ns|absent)$/i;
    const dns=r.slice(3).some(c=>DNS.test((c||"").trim()));
    for(let i=3;i<r.length;i++){
      const mins=parseTime(r[i]);
      loops.push(mins!=null?{mins}:null);
    }
    const done=loops.filter(Boolean);
    runners.push({dns,bib,nick:r[1]||"",name:r[2]||r[1]||"",loops,count:done.length,
      best:done.length?Math.min(...done.map(x=>x.mins)):null,
      avg:done.length?done.reduce((a,x)=>a+x.mins,0)/done.length:null});
  }
  return {hours,labels,runners};
}
function color(mins,lo,hi){
  const t=hi-lo<0.01?0:(mins-lo)/(hi-lo); // 0 fast..1 slow
  const a=getComputedStyle(document.documentElement).getPropertyValue("--heat-a")||.3;
  return `hsla(${Math.round(140-140*t)},62%,50%,${a})`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function stats(){
  const top=data.runners.filter(r=>r.count&&!r.dns)
    .map(r=>({...r,total:r.loops.filter(Boolean).reduce((a,x)=>a+x.mins,0)}))
    .sort((a,b)=>b.count-a.count||a.total-b.total).slice(0,5);
  document.getElementById("lb").innerHTML=top.length?top.map((r,i)=>
    `<div class="lbrow"><span class="rk">${i+1}</span><span class="lbn"><small>#${r.bib}</small>${esc(r.name)}</span><span class="lbl">${r.count}<small>loops</small></span><span class="lbt">${fmt(r.total)}</span></div>`).join("")
    :'<div class="msg" style="padding:16px">No loops logged yet</div>';
}
function render(){
  const wrap=document.getElementById("wrap");
  if(!data) return;
  let list=data.runners;
  if(tab==="fav") list=WATCH.map(b=>list.find(r=>r.bib===b)).filter(Boolean);
  const q=document.getElementById("q").value.trim().toLowerCase();
  if(q) list=list.filter(r=>String(r.bib)===q||(r.name+" "+r.nick).toLowerCase().includes(q));
  const s=document.getElementById("sort").value;
  list=list.slice();
  if(s==="bib" && tab==="all") list.sort((a,b)=>a.bib-b.bib);
  if(s==="loops") list.sort((a,b)=>b.count-a.count||a.bib-b.bib);
  if(s==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){wrap.innerHTML='<div class="msg">No runners found</div>';return}
  let maxLoop=3;
  for(const r of list) for(let i=0;i<r.loops.length;i++) if(r.loops[i]) maxLoop=Math.max(maxLoop,i+1);
  maxLoop=Math.min(maxLoop+1, data.labels.length);
  const all=list.flatMap(r=>r.loops.filter(Boolean).map(x=>x.mins));
  const lo=all.length?Math.min(...all):0, hi=all.length?Math.max(...all):0;
  let h='<table><thead><tr><th class="sticky">Runner</th><th>Loops</th><th>Best</th><th>Avg</th>';
  for(let i=0;i<maxLoop;i++) h+=`<th>${esc((data.labels[i]||"").replace("Loop ","Loop "))}<small>${esc(data.hours[i]||"")}</small></th>`;
  h+='</tr></thead><tbody>';
  for(const r of list){
    h+=`<tr><td class="sticky"><div class="runner"><span class="bibtag">${r.bib}</span><span class="name">${esc(r.name)}</span></div></td>`;
    if(r.dns){h+=`<td colspan="${maxLoop+3}" class="dns"><i>Did not start</i></td></tr>`;continue}
    h+=`<td class="loops ${r.count?"":"zero"}">${r.count}</td><td class="sub">${r.best!=null?fmt(r.best):"–"}</td><td class="sub">${r.avg!=null?fmt(r.avg):"–"}</td>`;
    for(let i=0;i<maxLoop;i++){
      const x=r.loops[i];
      if(!x) h+='<td class="empty">·</td>';
      else h+=`<td class="t ${x.mins===r.best?"best":""}"><i style="background:${color(x.mins,lo,hi)}">${fmt(x.mins)}</i></td>`;
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  const sx=wrap.scrollLeft, sy=wrap.scrollTop;
  wrap.innerHTML=h; wrap.scrollLeft=sx; wrap.scrollTop=sy;
}
async function load(){
  const dot=document.getElementById("dot"), upd=document.getElementById("upd");
  try{
    const r=await fetch("/api/sheet",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    data=build(await r.text());
    dot.classList.remove("err"); upd.textContent="Live · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
    stats(); render();
  }catch(e){
    dot.classList.add("err"); upd.textContent="Offline – retrying";
    if(!data) document.getElementById("wrap").innerHTML='<div class="msg">Could not load data. Retrying…</div>';
  }
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
document.getElementById("q").oninput=render;
document.getElementById("sort").onchange=render;
load(); setInterval(load,REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
